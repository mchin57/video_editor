# Gate for every pull request: typecheck, lint, formatting + the vitest suite. The `protect-main`
# ruleset requires the `test` check to pass before a PR can merge.
#
# Playwright e2e (`npm run test:e2e`) is NOT run here — it drives the built
# Electron app and stays a local gate (see CLAUDE.md "Definition of done").
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest   # the app's primary target; some tests assume a case-insensitive FS + Windows pipes
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
