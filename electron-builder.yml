appId: com.reeleditor.app
productName: Reel Editor
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
# Engine binaries (ffmpeg/ffprobe + whisper.cpp cli/dlls/model) staged by
# `npm run collect-binaries`. Shipped outside the asar so they're directly
# executable at runtime under <resources>/bin. ~1 GB — gitignored, not committed.
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # Bundled text-overlay fonts (OFL/Apache, redistributable, committed to the
  # repo — tiny). Passed to libass via `fontsdir` on export and served to the
  # renderer for @font-face previews. See resources/fonts/LICENSES.md.
  - from: resources/fonts
    to: fonts
    filter:
      - "**/*"
  # Background-removal model (RVM ONNX, ~15 MB) staged by `npm run collect-binaries`.
  # Discovered at runtime under <resources>/models. Optional — a build without it
  # simply leaves the "Remove background" feature unavailable (gated on presence).
  - from: resources/models
    to: models
    filter:
      - "**/*"
# onnxruntime-node ships a prebuilt native addon (.node + runtime dll); it must be
# unpacked from the asar so it can be loaded at runtime.
asarUnpack:
  - "**/node_modules/onnxruntime-node/**"
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  artifactName: ${productName}-${version}.${ext}
  category: public.app-category.video
# Auto-update feed. electron-builder bakes an app-update.yml pointing here into
# the build; electron-updater polls it on launch. TODO: confirm owner/repo — set
# to the actual GitHub repo before cutting a release. Uploading happens only with
# `electron-builder --publish` (or a GH_TOKEN in CI); a plain build just embeds
# the feed URL and never pushes anything.
publish:
  provider: github
  owner: mchin57
  repo: video_editor

